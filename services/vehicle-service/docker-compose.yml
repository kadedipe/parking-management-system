# ============================================================================
# Docker Compose - Vehicle Service Integration
# ============================================================================

# parking-management-system/services/vehicle-service/docker-compose.yml

version: '3.8'

services:
  vehicle-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3004
      - SERVICE_NAME=vehicle-service
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=vehicle_db
      - DB_USER=vehicle_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=*
      - RUN_MIGRATIONS=true
    volumes:
      - ./logs:/app/logs
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - redis
    networks:
      - parking-network

  postgres:
    image: postgres:15-alpine
    container_name: vehicle-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vehicle_db
      - POSTGRES_USER=vehicle_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - vehicle-postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - parking-network

  redis:
    image: redis:7-alpine
    container_name: vehicle-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - vehicle-redis-data:/data
    ports:
      - "6381:6379"
    networks:
      - parking-network

volumes:
  vehicle-postgres-data:
  vehicle-redis-data:

networks:
  parking-network:
    driver: bridge