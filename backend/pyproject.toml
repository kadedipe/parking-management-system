# ============================================================================
# Parking Management System - Backend pyproject.toml
# Modern Python project configuration with Poetry
# ============================================================================

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "parking-management-backend"
version = "1.0.0"
description = "Production-ready FastAPI backend for Parking Management System"
authors = [
    {name = "Parking Management Team", email = "team@parking-system.com"}
]
maintainers = [
    {name = "Development Team", email = "dev@parking-system.com"}
]
license = {text = "MIT"}
readme = "README.md"
homepage = "https://parking-system.com"
repository = "https://github.com/yourusername/parking-management-system"
documentation = "https://docs.parking-system.com"
keywords = [
    "parking",
    "management",
    "fastapi",
    "ev-charging",
    "microservices",
    "python",
    "postgresql",
    "redis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.13"

# ============================================================================
# Dependencies
# ============================================================================

dependencies = [
    # ===== Core Framework =====
    "fastapi>=0.104.0,<0.105.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
    "pydantic>=2.4.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "starlette>=0.27.0,<0.28.0",
    
    # ===== Database & ORM =====
    "sqlalchemy>=2.0.0,<2.1.0",
    "alembic>=1.12.0,<1.13.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pymongo>=4.5.0,<5.0.0",
    "redis>=5.0.0,<6.0.0",
    
    # ===== Message Queue =====
    "kafka-python>=2.0.0,<3.0.0",
    "aiokafka>=0.8.0,<0.9.0",
    "celery>=5.3.0,<6.0.0",
    
    # ===== Authentication & Security =====
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.6,<0.1.0",
    "cryptography>=41.0.0,<42.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    
    # ===== Payment Processing =====
    "stripe>=6.0.0,<7.0.0",
    
    # ===== Email & Notifications =====
    "sendgrid>=6.10.0,<7.0.0",
    "twilio>=8.0.0,<9.0.0",
    "jinja2>=3.1.0,<4.0.0",
    
    # ===== Monitoring & Logging =====
    "sentry-sdk>=1.38.0,<2.0.0",
    "structlog>=23.3.0,<24.0.0",
    "python-json-logger>=2.0.0,<3.0.0",
    "prometheus-client>=0.19.0,<0.20.0",
    
    # ===== AWS Services =====
    "boto3>=1.28.0,<2.0.0",
    
    # ===== Utilities =====
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.25.0,<0.26.0",
    "tenacity>=8.2.0,<9.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "typing-extensions>=4.8.0,<5.0.0",
    "email-validator>=2.1.0,<3.0.0",
    "pytz>=2023.3,<2024.0",
    "click>=8.1.0,<9.0.0",
    "python-telegram-bot>=20.0.0,<21.0.0",
    "uuid>=1.30,<2.0.0",
    "orjson>=3.9.0,<4.0.0",
]

# ============================================================================
# Optional Dependencies
# ============================================================================

[project.optional-dependencies]
dev = [
    "black>=23.11.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "flake8>=6.1.0,<7.0.0",
    "flake8-docstrings>=1.7.0,<2.0.0",
    "flake8-black>=0.3.0,<0.4.0",
    "flake8-bugbear>=23.11.0,<24.0.0",
    "flake8-comprehensions>=3.14.0,<4.0.0",
    "flake8-simplify>=0.21.0,<0.22.0",
    "mypy>=1.7.0,<2.0.0",
    "pylint>=3.0.0,<4.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "poetry>=1.7.0,<2.0.0",
    "poetry-plugin-export>=1.6.0,<2.0.0",
]
test = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.0,<0.22.0",
    "pytest-mock>=3.11.0,<4.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-httpx>=0.26.0,<0.27.0",
    "responses>=0.24.0,<0.25.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=20.0.0,<21.0.0",
    "coverage>=7.3.0,<8.0.0",
    "tox>=4.11.0,<5.0.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings>=0.24.0,<0.25.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0,<2.0.0",
    "mkdocs-include-markdown-plugin>=5.0.0,<6.0.0",
    "mkdocs-minify-plugin>=0.7.0,<0.8.0",
]
monitoring = [
    "opentelemetry-api>=1.22.0,<2.0.0",
    "opentelemetry-sdk>=1.22.0,<2.0.0",
    "opentelemetry-exporter-prometheus>=0.43b0,<0.44b0",
    "opentelemetry-instrumentation-fastapi>=0.43b0,<0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0,<0.44b0",
    "opentelemetry-instrumentation-redis>=0.43b0,<0.44b0",
]
all = [
    "parking-management-backend[dev,test,docs,monitoring]",
]

# ============================================================================
# Project URLs
# ============================================================================

[project.urls]
"Homepage" = "https://parking-system.com"
"Documentation" = "https://docs.parking-system.com"
"Repository" = "https://github.com/yourusername/parking-management-system"
"Issues" = "https://github.com/yourusername/parking-management-system/issues"
"Changelog" = "https://github.com/yourusername/parking-management-system/releases"

# ============================================================================
# Poetry Configuration
# ============================================================================

[tool.poetry]
name = "parking-management-backend"
version = "1.0.0"
description = "Production-ready FastAPI backend for Parking Management System"
authors = ["Parking Management Team <team@parking-system.com>"]
readme = "README.md"
homepage = "https://parking-system.com"
repository = "https://github.com/yourusername/parking-management-system"
documentation = "https://docs.parking-system.com"
license = "MIT"
keywords = ["parking", "management", "fastapi", "ev-charging", "microservices"]
include = [
    {path = "LICENSE", format = "sdist"},
    {path = "README.md", format = "sdist"},
    {path = "CHANGELOG.md", format = "sdist"},
    {path = "docs", format = "sdist"},
]
exclude = [
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "__pycache__",
    ".git",
    ".github",
    ".gitignore",
    ".env",
    ".env.*",
    "venv",
    ".venv",
    "node_modules",
    "dist",
    "build",
    "*.egg-info",
    "*.egg",
    "coverage",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
]

# ============================================================================
# Dependency Groups
# ============================================================================

[tool.poetry.group.dev.dependencies]
black = ">=23.11.0,<24.0.0"
isort = ">=5.12.0,<6.0.0"
flake8 = ">=6.1.0,<7.0.0"
flake8-docstrings = ">=1.7.0,<2.0.0"
flake8-black = ">=0.3.0,<0.4.0"
flake8-bugbear = ">=23.11.0,<24.0.0"
flake8-comprehensions = ">=3.14.0,<4.0.0"
flake8-simplify = ">=0.21.0,<0.22.0"
mypy = ">=1.7.0,<2.0.0"
pylint = ">=3.0.0,<4.0.0"
bandit = ">=1.7.0,<2.0.0"
pre-commit = ">=3.5.0,<4.0.0"
poetry = ">=1.7.0,<2.0.0"
poetry-plugin-export = ">=1.6.0,<2.0.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.4.0,<8.0.0"
pytest-cov = ">=4.1.0,<5.0.0"
pytest-asyncio = ">=0.21.0,<0.22.0"
pytest-mock = ">=3.11.0,<4.0.0"
pytest-xdist = ">=3.5.0,<4.0.0"
pytest-timeout = ">=2.2.0,<3.0.0"
pytest-httpx = ">=0.26.0,<0.27.0"
responses = ">=0.24.0,<0.25.0"
factory-boy = ">=3.3.0,<4.0.0"
faker = ">=20.0.0,<21.0.0"
coverage = ">=7.3.0,<8.0.0"
tox = ">=4.11.0,<5.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.5.0,<2.0.0"
mkdocs-material = ">=9.5.0,<10.0.0"
mkdocstrings = ">=0.24.0,<0.25.0"
mkdocs-git-revision-date-localized-plugin = ">=1.2.0,<2.0.0"
mkdocs-include-markdown-plugin = ">=5.0.0,<6.0.0"
mkdocs-minify-plugin = ">=0.7.0,<0.8.0"

[tool.poetry.group.monitoring.dependencies]
opentelemetry-api = ">=1.22.0,<2.0.0"
opentelemetry-sdk = ">=1.22.0,<2.0.0"
opentelemetry-exporter-prometheus = ">=0.43b0,<0.44b0"
opentelemetry-instrumentation-fastapi = ">=0.43b0,<0.44b0"
opentelemetry-instrumentation-sqlalchemy = ">=0.43b0,<0.44b0"
opentelemetry-instrumentation-redis = ">=0.43b0,<0.44b0"

# ============================================================================
# Black Configuration
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''
preview = true

# ============================================================================
# isort Configuration
# ============================================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".venv",
    "venv",
    "migrations",
    "alembic",
    "__pycache__",
    "build",
    "dist",
]
skip_glob = ["*__init__.py"]

# ============================================================================
# Flake8 Configuration
# ============================================================================

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "migrations",
    ".venv",
    "venv",
    "alembic",
]
docstring-convention = "google"

# ============================================================================
# Mypy Configuration
# ============================================================================

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
allow_redefinition = false
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
    "alembic",
    "tests",
]
[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "asyncpg.*",
    "pytest.*",
    "factory.*",
    "faker.*",
]
ignore_missing_imports = true

# ============================================================================
# Pylint Configuration
# ============================================================================

[tool.pylint]
max-line-length = 100
extension-pkg-whitelist = ["pydantic"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0801",  # duplicate-code
]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "fast: Fast running tests",
    "asyncio: Asynchronous tests",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/__init__.py",
    "*/alembic/*",
    "*/migrations/*",
    "*/scripts/*",
]
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

# ============================================================================
# Pydantic Configuration
# ============================================================================

[tool.pydantic]
init_typed = true
allow_mutation = true
use_enum_values = true
validate_assignment = true
orm_mode = true

# ============================================================================
# Bumpversion Configuration
# ============================================================================

[tool.bumpversion]
current_version = "1.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<release>[a-z]+)(?P<build>\\d+)?)?"
serialize = [
    "{major}.{minor}.{patch}-{release}{build}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Release v{new_version}"
commit = true
commit_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false

[tool.bumpversion.files]
filename = "pyproject.toml"

[tool.bumpversion.parts.release]
values = [
    "dev",
    "alpha",
    "beta",
    "rc",
    "final",
]
optional_value = "final"

# ============================================================================
# Commitizen Configuration
# ============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
bump_message = "chore(release): bump version $current_version → $new_version"
version_files = [
    "pyproject.toml:version",
    "README.md",
]

# ============================================================================
# Pre-commit Configuration
# ============================================================================

[tool.pre-commit]
default_install_hook_types = ["pre-commit", "commit-msg"]

# ============================================================================
# Bandit Configuration
# ============================================================================

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist", "migrations"]
skips = ["B101", "B311", "B404", "B603"]
severity = "medium"
confidence = "medium"

# ============================================================================
# Safety Configuration
# ============================================================================

[tool.safety]
ignore = [
    # Ignore specific CVEs if needed
    # "CVE-2023-12345",
]
output = "json"
policy_file = ".safety-policy.yml"

# ============================================================================
# Vulture Configuration
# ============================================================================

[tool.vulture]
min_confidence = 60
exclude = [
    "tests",
    "venv",
    ".venv",
    "build",
    "dist",
    "migrations",
    "alembic",
]

# ============================================================================
# Tox Configuration
# ============================================================================

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310,py311,py312
minversion = 4.0
skipsdist = true
isolated_build = true

[testenv]
allowlist_externals = poetry
commands =
    poetry install --no-root
    poetry run pytest tests/ -v

[testenv:lint]
commands =
    poetry install --no-root --with dev
    poetry run black --check src tests
    poetry run isort --check-only src tests
    poetry run flake8 src tests
    poetry run mypy src
    poetry run pylint src

[testenv:coverage]
commands =
    poetry install --no-root --with test
    poetry run pytest tests/ --cov=src --cov-report=html --cov-report=term

[testenv:docs]
commands =
    poetry install --no-root --with docs
    poetry run mkdocs build --clean

[testenv:security]
commands =
    poetry install --no-root --with dev
    poetry run bandit -r src -f json -o bandit-report.json
    poetry run safety check
"""