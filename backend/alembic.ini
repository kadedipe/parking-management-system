# ============================================================================
# Parking Management System - Alembic Configuration
# Database migration management for SQLAlchemy
# ============================================================================

# ============================================================================
# Alembic Core Configuration
# ============================================================================

[Alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(second).2d_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate slug length
truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision' command
revision_environment = true

# Set to 'true' if running in production environment
production = false

# ============================================================================
# Database Connection URL (Override in environment)
# ============================================================================

# This is the default URL used when no environment variable is set
# Override with: alembic -x dburl=postgresql://user:pass@host:5432/db upgrade head
sqlalchemy.url = postgresql://user:password@localhost:5432/parking_db

# ============================================================================
# Database Connection Configuration
# ============================================================================

# Connection pooling
pool_size = 5
max_overflow = 10
pool_timeout = 30
pool_recycle = 3600

# Logging configuration
sqlalchemy.echo = false
sqlalchemy.echo_pool = false
sqlalchemy.pool_pre_ping = true

# ============================================================================
# Migration File Configuration
# ============================================================================

# Version table name
version_table = alembic_version

# Version table schema (leave empty for default)
version_table_schema = 

# ============================================================================
# Custom Configuration Options
# ============================================================================

# Define custom options that can be passed to the migration environment
# These can be accessed via context.get_x_argument()
# Example: alembic -x back_populates=true upgrade head
# [x_args]
# back_populates = false

# ============================================================================
# Logging Configuration
# ============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S