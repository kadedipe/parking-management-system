# ============================================================================
# Kubernetes Secrets - Secret Management
# ============================================================================

# parking-management-system/infra/kubernetes/secrets.yaml

---
# Database Secret
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  host: cG9zdGdyZXM=  # postgres (base64 encoded)
  port: NTQzMg==      # 5432
  name: cGFya2luZ19kYg==  # parking_db
  user: cGFya2luZ191c2Vy  # parking_user
  password: YOUR_BASE64_ENCODED_PASSWORD

---
# Redis Secret
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  host: cmVkaXM=  # redis
  port: NjM3OQ==  # 6379
  password: YOUR_BASE64_ENCODED_PASSWORD

---
# JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  secret: YOUR_BASE64_ENCODED_JWT_SECRET
  refresh-secret: YOUR_BASE64_ENCODED_REFRESH_SECRET

---
# Stripe Secret
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  secret-key: YOUR_BASE64_ENCODED_STRIPE_SECRET_KEY
  webhook-secret: YOUR_BASE64_ENCODED_STRIPE_WEBHOOK_SECRET

---
# Sentry Secret
apiVersion: v1
kind: Secret
metadata:
  name: sentry-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  dsn: YOUR_BASE64_ENCODED_SENTRY_DSN

---
# AWS Secret
apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  access-key-id: YOUR_BASE64_ENCODED_AWS_ACCESS_KEY_ID
  secret-access-key: YOUR_BASE64_ENCODED_AWS_SECRET_ACCESS_KEY
  region: dXMtZWFzdC0x  # us-east-1
  s3-bucket: YOUR_BASE64_ENCODED_S3_BUCKET

---
# Email Secret
apiVersion: v1
kind: Secret
metadata:
  name: email-secret
  namespace: parking-system
  labels:
    app: parking
    environment: production
type: Opaque
data:
  host: YOUR_BASE64_ENCODED_EMAIL_HOST
  port: NTg3  # 587
  user: YOUR_BASE64_ENCODED_EMAIL_USER
  pass: YOUR_BASE64_ENCODED_EMAIL_PASSWORD