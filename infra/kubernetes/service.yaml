# ============================================================================
# Kubernetes Services - Service Configurations
# ============================================================================

# parking-management-system/infra/kubernetes/service.yaml

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: parking-backend-service
  namespace: parking-system
  labels:
    app: parking-backend
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  selector:
    app: parking-backend
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: parking-frontend-service
  namespace: parking-system
  labels:
    app: parking-frontend
    environment: production
spec:
  selector:
    app: parking-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP

---
# Nginx Service (LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: parking-nginx-service
  namespace: parking-system
  labels:
    app: parking-nginx
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/xxxxxx"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
spec:
  selector:
    app: parking-nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  - name: websocket
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: LoadBalancer
  externalTrafficPolicy: Local