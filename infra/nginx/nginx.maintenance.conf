# ============================================================================
# Nginx Maintenance Mode - Maintenance Page Configuration
# ============================================================================

# parking-management-system/infra/nginx/nginx.maintenance.conf

# Maintenance mode configuration
server {
    listen 80;
    listen 443 ssl http2;
    server_name parkingapp.com www.parkingapp.com;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Maintenance page
    root /usr/share/nginx/html;
    index maintenance.html;

    # Show maintenance page for all requests
    location / {
        try_files $uri /maintenance.html;
    }

    # Allow health checks
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Allow access to maintenance assets
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1h;
    }

    # Deny all other requests
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 503;
    }

    error_page 503 /maintenance.html;
}