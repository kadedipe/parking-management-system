# ============================================================================
# Nginx Canary Deployment - A/B Testing Configuration
# ============================================================================

# parking-management-system/infra/nginx/nginx.canary.conf

# Canary deployment configuration
upstream backend_stable {
    server backend-stable:3000 max_fails=3 fail_timeout=30s;
}

upstream backend_canary {
    server backend-canary:3000 max_fails=3 fail_timeout=30s;
}

upstream frontend_stable {
    server frontend-stable:80 max_fails=3 fail_timeout=30s;
}

upstream frontend_canary {
    server frontend-canary:80 max_fails=3 fail_timeout=30s;
}

server {
    listen 443 ssl http2;
    server_name parkingapp.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # API routing based on canary header or cookie
    location /api/ {
        # Split traffic: 90% stable, 10% canary
        if ($http_x_canary = "true") {
            set $backend_upstream backend_canary;
        }
        
        if ($cookie_canary = "true") {
            set $backend_upstream backend_canary;
        }
        
        # Default to stable
        if ($backend_upstream = "") {
            set $backend_upstream backend_stable;
        }
        
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add canary header to response
        add_header X-Canary-Deployment $backend_upstream always;
    }

    # Frontend routing with canary
    location / {
        # Random split for frontend
        set $frontend_upstream frontend_stable;
        
        # 10% chance for canary
        if ($request_uri ~* "^/(.*)$") {
            set $frontend_upstream frontend_canary;
        }
        
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add canary header to response
        add_header X-Canary-Deployment $frontend_upstream always;
    }
}